[project]
name = "observability"
version = "1.0.0"
description = "Python observability foundation for structured logging, metrics, and distributed tracing"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "VisionQuantech Custom Commercial License"}

# Logging, metrics, and tracing dependencies.
dependencies = [
    "structlog>=24.1.0",
    "python-json-logger>=2.0.7",
    "prometheus-client>=0.19.0",
    "opentelemetry-api>=1.22.0",
    "opentelemetry-sdk>=1.22.0",
    "opentelemetry-exporter-otlp>=1.22.0",
    "opentelemetry-instrumentation-fastapi>=0.43b0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
